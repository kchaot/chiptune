name: Build prüfen

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: dom, mbstring
          tools: composer

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format prüfen
        run: composer fmt:check

      - name: Lint
        run: composer lint

      - name: Statische Analyse
        run: composer analyse

      - name: Klassenbeschreibungen prüfen
        run: composer docs:check

      - name: Seite bauen
        run: php bin/build.php

      - name: Ausgabe mit dem Zielzweig vergleichen (nur Information)
        run: php bin/compare.php --info origin/${{ github.base_ref }}
